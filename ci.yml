name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Required files exist
        run: test -f index.html && test -f sw.js && test -f manifest.webmanifest && test -f icon.svg
      - name: Syntax check and money-logic tests
        run: npm test
      - name: No secret keys in the page (only the publishable key is allowed)
        run: "! grep -Ei 'service_role|sb_secret_|postgres://' index.html sw.js"
