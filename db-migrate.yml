# Manual only. Applies new files from database/migrations to the live Supabase project.
# Protect it: GitHub repo > Settings > Environments > production > Required reviewers (yourself).
name: Database migrate (manual)
on:
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: wuxowaxayleogmvrjbxk
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$PROJECT_REF"
      - name: Show what would change
        run: supabase db push --dry-run
      - name: Apply
        run: supabase db push
